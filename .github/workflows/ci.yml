name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust foundation gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify semantic boundary remains fail-closed
        run: |
          git diff --check
          if grep -REn '\b(unwrap|expect|todo!|unimplemented!)\b|panic!' crates/game-mod/src; then exit 1; fi
          if grep -En 'raw_memory|random_state|future_rng|host_object|process_command|screen_coordinate|input_event' experiments/managed-rust-interop/game-loader/RuntimeV3GameplayObservation.cs; then exit 1; fi

      - name: Verify copied POC artifact checksums
        working-directory: protocol-artifact/poc-v1
        run: sha256sum -c SHA256SUMS

      - name: Verify copied Runtime-v1 artifact checksums
        working-directory: protocol-artifact/runtime-v1
        run: sha256sum -c SHA256SUMS

      - name: Validate copied POC JSON fixtures
        run: |
          cmp protocol-artifact/poc-v1/schema.json schemas/poc-v1.schema.json
          jq -e '. as $schema |
            ($schema["$id"] == "sts2-poc-v1" and
              ($schema.oneOf | length == 4) and
              $schema["$defs"].base.properties.generation.maximum == 9007199254740991 and
              (["state_request", "state_response", "action_request", "action_response"]
                | all(.[]; $schema["$defs"][.].unevaluatedProperties == false)))' \
            protocol-artifact/poc-v1/schema.json > /dev/null
          for file in protocol-artifact/poc-v1/schema.json \
            schemas/poc-v1.schema.json \
            protocol-artifact/poc-v1/manifest.json \
            protocol-artifact/poc-v1/golden/state-request.json \
            protocol-artifact/poc-v1/golden/state-response.json \
            protocol-artifact/poc-v1/golden/action-request.json \
            protocol-artifact/poc-v1/golden/action-accepted.json \
            protocol-artifact/poc-v1/golden/action-rejected.json \
            protocol-artifact/poc-v1/fixtures/invalid-action.json \
            conformance/cases/poc-v1.json; do
            jq -e 'type == "object"' "$file" > /dev/null
          done

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run ephemeral session launcher synthetic checks
        run: |
          bash experiments/managed-rust-interop/session-launcher.test.sh
          bash experiments/managed-rust-interop/session-restore.test.sh
          bash experiments/managed-rust-interop/session-bridge.test.sh
          bash experiments/managed-rust-interop/provider-build.test.sh
          bash experiments/managed-rust-interop/session-install.test.sh
          bash experiments/managed-rust-interop/live-authorization.test.sh
          bash experiments/managed-rust-interop/package-runtime-addon.test.sh
          bash experiments/managed-rust-interop/dev-cycle.test.sh
          bash experiments/managed-rust-interop/session-launcher.sh --self-test

      - name: Validate Workshop package staging
        run: bash tools/workshop/test-package-item.sh

  managed-source:
    name: Managed source-only boundary
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact .NET 9 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.317

      - name: Build source-only managed probe
        run: dotnet build experiments/managed-rust-interop/managed/ManagedInteropSpike.csproj --configuration Release

      - name: Run managed Workshop validation probe
        run: dotnet run --project experiments/managed-rust-interop/workshop/WorkshopValidationProbe.csproj --configuration Release

      - name: Run managed profile settings validation probe
        run: dotnet run --project experiments/managed-rust-interop/settings-tests/SettingsValidationProbe.csproj --configuration Release

      - name: Run managed runtime queue regressions
        # The queue probe links production managed callback sources to original test doubles.
        run: dotnet run --project experiments/managed-rust-interop/queue-tests/RuntimeQueueProbe.csproj --configuration Release

      - name: Run managed runtime-v1 contract regressions
        run: dotnet run --project experiments/managed-rust-interop/contract-tests/RuntimeContractProbe.csproj --configuration Release

      - name: Run source-linked replay controller regressions
        # These fakes exercise controller logic, not host compatibility.
        run: dotnet run --project experiments/managed-rust-interop/replay-tests/ReplayValidationProbe.csproj --configuration Release

      - name: Validate owned Windows process bridge without a game
        run: |
          pwsh -NoProfile -NonInteractive -File experiments/managed-rust-interop/dev-cycle-process-tests.ps1
          dotnet build experiments/managed-rust-interop/session-launcher/windows-bridge/SessionWindowsBridge.csproj --configuration Release -warnaserror
          dotnet run --project experiments/managed-rust-interop/session-launcher/bridge-tests/SessionWindowsBridgeTests.csproj --configuration Release -warnaserror

      - name: Run source-linked host candidate safety regressions
        run: dotnet run --project experiments/managed-rust-interop/host-candidate-tests/HostCandidateProbe.csproj --configuration Release

      - name: Run managed Runtime-v3 request and settlement probe
        run: dotnet run --project experiments/managed-rust-interop/gameplay-tests/RuntimeV3ValidationProbe.csproj --configuration Release

      - name: Record exact-host build precondition
        run: Write-Output "Host-loader build requires an operator-supplied sts2.dll and is not run in CI."
