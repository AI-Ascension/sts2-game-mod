name: Repository policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Test repository policy tool
        run: cargo test --locked --package repo-policy

      - name: Enforce repository policy
        run: cargo run --locked --package repo-policy -- --strict

      - name: Validate pinned game-information responses
        run: cargo build --locked --bin game_information_schema_validate --manifest-path experiments/managed-rust-interop/native/Cargo.toml && target/debug/game_information_schema_validate < protocol-artifact/game-information-query-v1/golden/capabilities-response.json && target/debug/game_information_schema_validate < protocol-artifact/game-information-query-v1/golden/static-page-1-response.json
