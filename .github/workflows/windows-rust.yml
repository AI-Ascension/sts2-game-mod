name: Windows Rust cross-check

on:
  pull_request:
  push:
    branches: [main]

permissions: {contents: read}

concurrency:
  group: windows-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-rust:
    name: Windows Rust compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Add the Windows target
        run: rustup target add x86_64-pc-windows-gnu --toolchain 1.97.1

      - name: Check the Windows target compiles
        # Cross-checking the gnu target compiles every Windows-active item -- the
        # `cfg(windows)` arms plus the `cfg(not(unix))` and
        # `cfg(not(target_os = "linux"))` ones no `cfg(windows)` grep reaches --
        # including test-only modules, without needing a Windows host or linker.
        # The deny matters as much as the target: the host Clippy gate cannot see a
        # warning whose item is `target_os = "linux"`-gated, so without it this leg
        # would compile the Windows surface and forgive every warning on it.
        # Note for anyone converting this step into a LINKING command: RUSTFLAGS
        # here replaces the target's `.cargo/config.toml` rustflags rather than
        # merging with them, so `-C link-arg=-Wl,--no-insert-timestamp` (the PE
        # timestamp suppression) is absent from this step and must be re-added.
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-gnu

      - name: Check the Windows target's documentation links
        # The step above proves the Windows surface compiles; it says nothing about
        # its doc comments. The host doc gate runs on Ubuntu, where rustdoc compiles
        # the same items out, so a broken link inside one is silent there. This runs
        # the host gate's three denies on the target that makes them bite.
        # Read the verdict from the LOG, not the conclusion: a misspelled deny is an
        # inert `unknown lint` warning that still exits 0.
        env:
          RUSTDOCFLAGS: '-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::redundant_explicit_links --document-private-items'
        run: |
          set -o pipefail
          log=target/windows-doc.log
          status=0
          cargo doc --workspace --no-deps --locked --target x86_64-pc-windows-gnu 2>&1 | tee "$log" || status=$?
          errors=$(awk '/^error/{count++} END{print count+0}' "$log")
          unknown=$(awk '/unknown lint/{count++} END{print count+0}' "$log")
          warnings=$(awk '/^warning/{count++} END{print count+0}' "$log")
          documented=$(awk '/^ *Documenting /{count++} END{print count+0}' "$log")
          expected=$(awk '/^[[:space:]]*members[[:space:]]*=[[:space:]]*\[/{f=1} f{n+=gsub(/"[^"]*"/,"&"); if(/\]/) f=0} END{print n+0}' Cargo.toml)
          echo "windows-doc: exit=$status errors=$errors warnings=$warnings unknown_lints=$unknown documented=$documented expected=$expected"
          [ "$status" -eq 0 ] && [ "$errors" -eq 0 ] && [ "$warnings" -eq 0 ] && [ "$unknown" -eq 0 ] && [ "$expected" -gt 0 ] && [ "$documented" -eq "$expected" ]
