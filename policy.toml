[limits]
rust_production_preferred = 300
rust_production_max = 400
rust_test_preferred = 400
rust_test_max = 600
csharp_production_preferred = 250
csharp_production_max = 350
csharp_test_preferred = 350
csharp_test_max = 500
workflow_preferred = 160
workflow_max = 200
markdown_preferred = 500
markdown_max = 700

[exemptions]
"crates/game-mod/src/runtime_v3_gameplay/contract.rs" = "Handwritten neutral-contract mirror retained as one review unit; split or regenerate with the next schema tool."
"crates/game-mod/src/runtime_v3_gameplay/runtime.rs" = "Handwritten host-thread adapter retained as one review unit; split at the next runtime contract revision."
"experiments/managed-rust-interop/game-loader/RuntimeV3GameplaySupport.cs" = "Source-only managed compatibility seam is retained as one host boundary; split when the licensed SDK is supplied."
"experiments/managed-rust-interop/game-loader/RuntimeV3GameplayHost.cs" = "Source-only managed host boundary retains one authoritative receipt and postcondition unit; split when the licensed SDK is supplied."
