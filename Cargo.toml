[workspace]
members = [
    "tools/repo-policy",
    "tools/mod-loading",
    "tools/release-tool",
    "tools/seeded-run-client",
    "experiments/managed-rust-interop/native",
    "crates/host",
    "crates/http-adapter",
    "crates/game-mod",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.4.3"
jsonschema = { version = "=0.59.0", default-features = false }
libc = "=0.2.191"
sts2-protocol = { git = "https://github.com/AI-Ascension/sts2-protocol.git", rev = "0af77ebb72f8adba75ffafecfcc999fcfc78245d" }
sts2-game-core = { git = "https://github.com/AI-Ascension/sts2-game-core.git", rev = "941939dc75e3305d409340552cb1bd2b0e2f98a5" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
